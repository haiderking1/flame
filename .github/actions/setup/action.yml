name: Set up Flame
description: Bun, Node and Flame's dependencies, with Bun's packages, Electron and electron-builder's tools kept between runs.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with: { bun-version: 1.4.2 }
    - uses: actions/setup-node@v5
      with: { node-version: 26 }
    - uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: flame-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: flame-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile
