name: Test

# Typecheck and the full test suite, split across runners. Each runner still runs its tests one at a time: the Electron
# UI tests time real windows, so they never share a machine with each other. Called by CI and Release.
on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - if: matrix.shard == 1
        run: bun run typecheck
      - run: git config --global user.name "Flame CI" && git config --global user.email "ci@users.noreply.github.com"
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs; allow them rather than run Electron unsandboxed.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run build
      # The same run as `bun run test`, one shard of its files.
      - run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs
