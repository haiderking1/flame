name: CI

# Every push to main and every pull request: typecheck, the full test suite, and installers built on every platform.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.2 }
      - uses: actions/setup-node@v5
        with: { node-version: 26 }
      # Bun's packages, Electron and electron-builder's tools, kept between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: flame-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: flame-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: git config --global user.name "Flame CI" && git config --global user.email "ci@users.noreply.github.com"
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs; allow them rather than run Electron unsandboxed.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run test

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # A CI build is a preview: it is never offered as an update.
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
