name: CI

# Every push to main and every pull request: typecheck, the full test suite, and the packaged app smoke-tested on Linux.
# Installers for every platform are built when a change can affect packaging, and when run manually; nightly releases
# build them every day main changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      quick: ${{ steps.plan.outputs.quick }}
    steps:
      - uses: actions/checkout@v5
      # What packages the app, what it loads natively, and the main process: changes here build every platform.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            packaging:
              - package.json
              - bun.lock
              - patches/**
              - resources/**
              - scripts/desktop/**
              - src/main/**
              - .github/**
      # A CI build is a preview: it is never offered as an update.
      - id: plan
        env:
          PACKAGING: ${{ steps.changes.outputs.packaging }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "version=$(node -p "require('./package.json').version")-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "quick=$([ "$PACKAGING" = true ] || [ "$MANUAL" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/test.yml

  desktop:
    needs: plan
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      quick: ${{ needs.plan.outputs.quick == 'true' }}
